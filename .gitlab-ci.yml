stages:
  - sync

sync_to_github:
  stage: sync
  image: repo.odlcloud.com/gitlab/git-sync:latest
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"      # full history
  before_script:
#    - apk add --no-cache git curl
    - git config --global user.name "GitLab Sync Bot"
    - git config --global user.email "gitlab-sync@local"

    # Add / refresh GitHub remote
    - git remote remove github || true
    - git remote add github "https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_OWNER}/${CI_PROJECT_NAME}.git"

  script:
    # Make sure we see all branches & tags from GitLab
    - git fetch origin --prune --tags

    - |
      if [ -n "$CI_COMMIT_BRANCH" ]; then
        echo "Syncing branch '$CI_COMMIT_BRANCH' to GitHub..."

        # Push exactly this branch to GitHub (force to keep mirror in sync)
        git push github "$CI_COMMIT_SHA:refs/heads/$CI_COMMIT_BRANCH" --force

      elif [ -n "$CI_COMMIT_TAG" ]; then
        echo "Syncing tag '$CI_COMMIT_TAG' to GitHub..."

        # Push exactly this tag to GitHub
        git push github "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG" --force

      else
        echo "No branch or tag context, nothing to sync."
      fi

  only:
    - branches
    - tags