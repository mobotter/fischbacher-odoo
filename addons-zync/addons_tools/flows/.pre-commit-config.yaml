repos:
  - repo: https://github.com/psf/black
    rev: 24.2.0  # Use the latest Black version
    hooks:
      - id: black
        exclude: (^zbsync_odoo/odoorpc_repo|odoo/|addons_OCA/|enterprise)
        files: \.py$
  - repo: local
    hooks: 
      - id: xml-format
        name: Format XML files
        entry: |
            bash -c '
            for file in "$@"; do
              echo "$file"
              if [[ -s "$file" ]]; then
                  xmllint --format "$file" | expand -t 4 > "$file.tmp" && mv "$file.tmp" "$file"
              else
                  echo "$file is empty, skipping..."
              fi
            done'
        language: system
        files: \.xml$