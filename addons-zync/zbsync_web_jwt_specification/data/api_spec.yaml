components:
  schemas:
    authenticate:
      properties:
        password:
          description: Password
          type: string
        token_type:
          description: Token Type
          enum:
            - Access
            - User
          type: string
        username:
          description: User Name
          type: string
      required:
        - username
        - password
        - token_type
      type: object
    authenticate_response:
      properties:
        token:
          description: Token
          type: string
        token_type:
          description: Token Type
          enum:
            - Access
            - User
          type: string
      required:
        - token
        - token_type
      type: object
info:
  description: Authenticate
  title: Authenticate
  version: 1.0.0
openapi: 3.0.3
paths:
  /jwt/authenticate:
    post:
      description: Authentication Endpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/authenticate"
        description: Authentication Model
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/authenticate_response"
          description: Authenticate Response Model
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "500":
          description: Internal Server Error
      summary: "jwt/authenticate - Authentication Endpoint "
servers:
  - description: Main Server API
    url: https://odoo02.dev.motiondrive.ag/zync
