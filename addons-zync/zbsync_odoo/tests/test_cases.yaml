    check: |
      assert record
      record = env['zbs.test.order'].browse(record.created.id)
      assert record.name == "order1"
      assert record.tag_ids.name == "tag1"
      assert record.tag_ids.anyfield == "v1"
      assert record.tag_ids.search_count([]) == 1
      assert isinstance(data.created[0].id, int)

