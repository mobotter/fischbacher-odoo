  - name: do not updated write_date of tag when adding tag to partner
    dump_model: zbs.test.partner
    prep: |
      tag = env['zbs.test.tag'].create({'name': 'tag1', 'anyfield': 'somevalue'})
      partner1 = env["zbs.test.partner"].create({"name": "partner1"})
      instance_env['tag_write_date'] = tag.write_date
    input: |
      {
        "id": partner1.id,
        "tag_ids": [
          {
            "___keys": ["name"],
            "name": "tag1",
          }
        ],
        "___keys": [
            "id",
        ],
      }
    check: |
      partner = env['zbs.test.order'].browse(record.updated[0][0])
      tag = env['zbs.test.tag'].search([('name', '=', 'tag1')])
      assert tag.write_date == instance_env['tag_write_date'], f"Write date of tag should not change: {tag.write_date} {instance_env['tag_write_date']}"
      assert tag.anyfield == "somevalue", f"Tag should have anyfield value not {tag.anyfield}"

