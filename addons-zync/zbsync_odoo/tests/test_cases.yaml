# TODO do a test that id is used as key per default
dumper:
  - name: m2o_with_id
    summary: Import a many2one record.
    description: Import a many2one record.
    dump_model: zbs.test.order
    prep: |
      partner1 = env['zbs.test.partner'].create({"name": "hans"})
    input: |
      {
            "name": "testpartner1",
            "partner_id": partner1.id,
      }
    check: |
      assert record.created.name == "testpartner1"
      assert record.created.partner_id
      assert env['zbs.test.partner'].browse(record.created.partner_id).name == "hans"
      assert bool(isinstance(data.created[0].id, int))

  - name: m2o_keyresolve
    summary: Find many2one record by explicit keys.
    dump_model: zbs.test.order
    prep: |
      partner1 = env['zbs.test.partner'].create({"name": "hans"})
    input: |
      {
        "name": "testpartner1",
        "partner_id": {
          "___keys": ["name"],
          "name": "hans",
        },
      }
    check: |
      assert record
      assert record.created.name == "testpartner1"
      partner = env['zbs.test.partner'].browse(record.created.partner_id)
      assert partner.name == "hans"
      assert partner.search_count([]) == 1
      assert isinstance(data.created[0].id, int)

  - name: m2o_keyresolve_two_levels_recursive
    summary: Find many2one record by explicit keys and one of its children
    dump_model: zbs.test.order
    prep: |
      env["zbs.test.order"].search([]).unlink()
      env["zbs.test.partner"].search([]).unlink()
      partner1 = env["zbs.test.partner"].create({"name": "hans"})
    input: |
      {
        "name": "testpartner1",
        "partner_id": {
            "___keys": ["name"],
            "name": "hans",
            "parent_partner_id": {
              "___keys": ["name"],
              "name": "hans",
            },
        },
      }
    check: |
      assert record
      order = env['zbs.test.order'].browse(record.created.id)
      assert order.name ==  "testpartner1"
      partner = env['zbs.test.partner'].browse(record.created.partner_id)
      assert partner.name == "hans"
      assert partner.search_count([]) == 1
      assert(isinstance(data.created[0].id, int))

  - name: one2many
    dump_model: zbs.test.order
    summary: force use of parent key to identify
    prep: |
      env["zbs.test.order.line"].search([]).unlink()
      env["zbs.test.order.line"].create(
        [
          {"name": "product1"},
          {"name": "product2"},
        ]
      )
    input: |
      {
        "name": "order1",
        "line_ids": [
          {"name": "product1", "___keys": ["name"]},
          {"name": "product2", "___keys": ["name"]},
        ],
      }
    check: |
      assert record
      record = env['zbs.test.order'].browse(record.created.id)
      assert record.name == "order1"
      assert record.line_ids[0].name == "product1"
      assert record.line_ids[1].name == "product2"
      assert isinstance(data.created[0].id, int)

  - name: one2many with extra non key fields
    summary: one2many with extra non key fields
    continue_from: one2many
    dump_model: zbs.test.order
    prep: |
    input: |
      {
          "name": "order1",
          "___keys": ["name"],
          "line_ids": [
              {"name": "product1", "___keys": ["name"], "anyfield": "abc"},
          ],
      }
    check: |
      assert record
      record = env['zbs.test.order'].browse(record.updated[0][0])
      assert record.name == "order1", 'order1 name not found'
      assert record.line_ids[0].name == "product1", 'product should be product1'
      assert record.line_ids[0].anyfield == "abc", 'anyfield should be abc'
      assert len(record.line_ids) == 2, 'lines should be 2'

  - name: one2many_unlink
    summary: one2many test unlinking some lines
    continue_from: one2many with extra non key fields
    dump_model: zbs.test.order
    prep: |

    input: |
      {
          "name": "order1",
          "___keys": ["name"],
          "___keys_delete": ["line_ids"],
          "line_ids": [
              {
                  "name": "product1",
                  "anyfield": "abcd",
                  "___keys": ["name"],
              },
          ],
      }
    check: |
      assert record
      order = env['zbs.test.order'].browse(record.updated[0][0])
      assert order.name == "order1", 'name should be order1'
      assert order.line_ids[0].name == "product1", 'name line should be product1'
      assert order.line_ids[0].anyfield == "abcd", 'name anyfield should be abcd'
      assert len(order.line_ids) == 1

  - name: many2many
    summary: many2many
