    check: |
      partner = env['zbs.test.order'].browse(record.updated[0][0])
      tag = env['zbs.test.tag'].search([('name', '=', 'tag1')])
      assert tag.write_date != instance_env['tag_write_date'], f"Write date of tag should be updated: {tag.write_date} {instance_env['tag_write_date']}"
      assert tag.anyfield == "somevalue2", f"Tag should have anyfield value not {tag.anyfield}"

